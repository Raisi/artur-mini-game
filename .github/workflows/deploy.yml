# Baut das Spiel bei jedem Push auf "main" und veröffentlicht es auf GitHub Pages.
name: Deploy auf GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # erlaubt auch einen Start per Knopf im "Actions"-Tab

# Rechte, die GitHub Pages zum Veröffentlichen braucht
permissions:
  contents: read
  pages: write
  id-token: write

# Immer nur ein Deployment gleichzeitig; ein laufendes wird nicht abgebrochen
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
